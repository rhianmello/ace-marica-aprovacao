<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProvaNorte — Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="brand.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0d1014;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px}.box{width:min(430px,100%);background:#181d23;border:1px solid #303740;border-radius:20px;padding:28px}.logo{font-size:28px;font-weight:900;color:#fff;text-decoration:none}.logo b{color:#e4c64a}h1{margin:22px 0 8px}p{color:#a6adb7;line-height:1.5}label{display:block;margin-top:14px;color:#d8dde5;font-size:14px}input{width:100%;margin-top:7px;padding:12px;border-radius:9px;border:1px solid #343b45;background:#11161b;color:#fff}.hint{font-size:12px;color:#8f98a4;margin-top:6px}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:9px;padding:12px 16px;background:#e4c64a;color:#111;font-weight:800;cursor:pointer}.secondary{background:#2b3139;color:#fff}.msg{margin-top:14px;color:#ff9b9b}.ok{color:#8be3b7}.link{color:#ddd;text-decoration:none}</style></head><body><main class="box"><a class="logo" href="index.html">Prova<b>Norte</b></a><h1 id="title">Entrar no ProvaNorte</h1><p id="desc">Faça login para acessar seus concursos e continuar seus estudos.</p><form id="form"><div id="nameWrap" style="display:none"><label>Nome completo<input id="name" type="text" autocomplete="name" minlength="2" placeholder="Ex.: João da Silva"></label><div class="hint">Esse nome será usado para identificar sua conta no painel administrativo.</div></div><label>E-mail<input id="email" type="email" autocomplete="email" required></label><label>Senha<input id="password" type="password" autocomplete="new-password" minlength="6" required></label><div class="actions"><button class="btn" id="submit" type="submit">Entrar</button><button class="btn secondary" id="toggle" type="button">Criar cadastro</button></div></form><div id="msg" class="msg"></div><p style="margin-top:18px"><a class="link" href="index.html">← Voltar para a página inicial</a></p></main><script>const sb=supabase.createClient('https://ztqtcbzjesrkuaijmylm.supabase.co','sb_publishable_Lh0A_Ykm2h66ur3LojJKTQ_JdUVMK9d');let signup=new URLSearchParams(location.search).get('cadastro')==='1';const title=document.getElementById('title'),desc=document.getElementById('desc'),submit=document.getElementById('submit'),toggle=document.getElementById('toggle'),nameWrap=document.getElementById('nameWrap'),name=document.getElementById('name'),email=document.getElementById('email'),password=document.getElementById('password'),form=document.getElementById('form'),msg=document.getElementById('msg');function render(){title.textContent=signup?'Criar cadastro':'Entrar no ProvaNorte';desc.textContent=signup?'Crie sua conta para acessar os concursos e salvar seu progresso.':'Faça login para acessar seus concursos e continuar seus estudos.';submit.textContent=signup?'Criar conta':'Entrar';toggle.textContent=signup?'Já tenho cadastro':'Criar cadastro';nameWrap.style.display=signup?'block':'none';name.required=signup}render();toggle.onclick=()=>{signup=!signup;render();msg.textContent=''};form.onsubmit=async(e)=>{e.preventDefault();msg.className='msg';msg.textContent=signup?'Criando conta...':'Entrando...';let r;if(signup){r=await sb.auth.signUp({email:email.value.trim(),password:password.value,options:{data:{full_name:name.value.trim(),nome:name.value.trim()}}})}else{r=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value})}if(r.error){msg.textContent=r.error.message;return}msg.className='msg ok';if(signup&&!r.data.session){msg.textContent='Cadastro criado. Verifique seu e-mail se a confirmação estiver habilitada.';return}const target=sessionStorage.getItem('ap_target')||'concursos.html';sessionStorage.removeItem('ap_target');location.href=target};</script></body></html>
