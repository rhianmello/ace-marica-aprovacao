name: Enriquecer explicações das questões

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Quantidade máxima de questões por execução'
        required: false
        default: '10'
  schedule:
    - cron: '30 9 * * *'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install --quiet openai

      - name: Processar questões
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          AI_EXPLANATION_BATCH: ${{ inputs.batch_size || '10' }}
        run: python scripts/enrich_explanations.py

      - name: Commitar alterações
        run: |
          git config user.name "AprovaAI Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ace_marica_questoes_seed.json ia_explicacoes_relatorio.json
          if git diff --cached --quiet; then
            echo "Nenhuma questão atualizada."
          else
            git commit -m "Atualiza explicações e validação das questões"
            git push
          fi
