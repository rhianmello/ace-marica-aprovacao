name: Corrigir explicacoes do banco

on:
  push:
    paths:
      - '.github/workflows/corrigir-explicacoes.yml'
      - 'ace_marica_questoes_seed.json'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar explicacoes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('ace_marica_questoes_seed.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          changed = 0

          for q in data:
              text = (q.get('enunciado') or '').strip()
              if text.startswith('Segundo o Calendário de vacinação do Estado de São Paulo o reforço da VIP'):
                  q['explicacao'] = (
                      'A alternativa E está correta porque, no calendário de vacinação do Estado de São Paulo citado nesta questão, '
                      'o primeiro reforço da vacinação contra a poliomielite ocorre aos 15 meses. O esquema básico da VIP é iniciado '
                      'nos primeiros meses de vida e o reforço é realizado posteriormente para manter a proteção contra a poliomielite. '
                      'Assim, entre as alternativas apresentadas (2, 6, 8, 10 e 15 meses), a idade indicada no calendário usado pela questão é 15 meses.'
                  )
                  changed += 1

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Explicacoes atualizadas: {changed}')
          PY
      - name: Commit alteracoes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ace_marica_questoes_seed.json
          git diff --cached --quiet && exit 0
          git commit -m 'Explica questao de reforco da VIP'
          git push
