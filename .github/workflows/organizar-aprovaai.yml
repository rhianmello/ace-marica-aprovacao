name: Organizar AprovaAI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: organizar-aprovaai-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Validar estrutura do site
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              'index.html',
              'transpetro.html',
              'inspetor_eletrica.html',
              'INSPETOR_ELETRICA/banco-questoes/inspetor_eletrica_banco.js',
          ]
          missing = [p for p in required if not Path(p).is_file()]
          if missing:
              raise SystemExit('Arquivos obrigatórios ausentes: ' + ', '.join(missing))

          index = Path('index.html').read_text(encoding='utf-8')
          if 'href="inspetor_eletrica.html"' not in index:
              raise SystemExit('O card do Inspetor de Elétrica não está no index.html')

          bank = Path('INSPETOR_ELETRICA/banco-questoes/inspetor_eletrica_banco.js').read_text(encoding='utf-8')
          if 'INSPETOR_ELETRICA_BANK' not in bank:
              raise SystemExit('Banco de questões do Inspetor não exporta INSPETOR_ELETRICA_BANK')

          print('OK: estrutura do AprovaAI validada.')
          PY
