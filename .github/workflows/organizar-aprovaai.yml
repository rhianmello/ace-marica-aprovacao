name: Organizar AprovaAI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: organizar-aprovaai-main
  cancel-in-progress: true

jobs:
  organize:
    if: github.event.head_commit.message != 'Organiza AprovaAI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Garantir página inicial
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          content = index.read_text(encoding='utf-8')
          card = '<a class="card" href="inspetor_eletrica.html"><div class="icon">⚡</div><h2>Inspetor de Elétrica</h2><p class="muted">Inspetor / Elétrica Nível 1 — elétrica industrial, inspeção, metrologia, qualidade e segurança.</p><span class="btn">Estudar Inspetor de Elétrica →</span></a>'
          if 'href="inspetor_eletrica.html"' not in content:
              marker = '</div><p class="muted" style="margin-top:28px">'
              if marker in content:
                  content = content.replace(marker, card + '</div><p class="muted" style="margin-top:28px">', 1)
              elif '</div></body></html>' in content:
                  content = content.replace('</div></body></html>', card + '</div></body></html>', 1)
              else:
                  raise SystemExit('index.html não está no formato esperado')
              index.write_text(content, encoding='utf-8')
          PY

      - name: Commitar organização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git pull --rebase origin main
          git commit -m "Organiza AprovaAI"
          git push
