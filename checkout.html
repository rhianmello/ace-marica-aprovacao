<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProvaNorte — Checkout</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="brand.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#0d1014;color:#fff;font:14px Arial}.wrap{max-width:980px;margin:auto;padding:24px}.hero,.card{background:#181d23;border:1px solid #303740;border-radius:16px}.hero{padding:24px;background:linear-gradient(135deg,#171b21,#3d3515)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.card{padding:20px;cursor:pointer;transition:.15s}.card:hover{border-color:#777}.card.selected{border-color:#e4c64a;box-shadow:0 0 0 1px #e4c64a}.muted{color:#a6adb7;line-height:1.5}.btn{border:0;border-radius:9px;padding:11px 15px;background:#e4c64a;color:#111;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#2b3139;color:#fff;border:1px solid #434a54}.price{font-size:25px;font-weight:900;margin:14px 0 4px}.installment{color:#f2d86b;font-weight:700}.valid{margin-top:12px;font-size:12px;color:#8be3b7}.msg{margin-top:16px;padding:12px;border-radius:9px}.ok{background:#1c3027;color:#8be3b7}.err{background:#2b1b1e;color:#ffb4b4}.summary{margin-top:18px;padding:16px;border:1px solid #4a4322;background:#191710;border-radius:12px}.summary strong{color:#f2d86b}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><h1>Escolha o curso / cargo</h1><p class="muted">Selecione exatamente qual preparação você quer comprar. O pagamento será processado pelo Mercado Pago e a compra ficará vinculada somente ao curso escolhido.</p></section><div id="grid" class="grid"></div><div id="summary" class="summary" style="display:none"></div><div style="margin-top:18px"><button id="continue" class="btn" disabled>Continuar para pagamento</button><a class="btn secondary" href="concursos.html">Voltar</a></div><div id="msg"></div></main><script>const sb=supabase.createClient('https://ztqtcbzjesrkuaijmylm.supabase.co','sb_publishable_Lh0A_Ykm2h66ur3LojJKTQ_JdUVMK9d');let courses=[],selected=null;const $=id=>document.getElementById(id),money=v=>(Number(v||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function render(){ $('grid').innerHTML=courses.map(c=>`<div class="card ${selected===c.id?'selected':''}" onclick="selectCourse(${c.id})"><h2>${esc(c.name)}</h2><p class="muted">${esc(c.description||'Preparação completa para o curso/cargo selecionado.')}</p><div class="price">${money(c.price_cents||1990)}</div><div class="installment">12x a partir de R$ 1,66</div><div class="valid">✓ 1 ano de acesso após a confirmação do pagamento</div><div style="margin-top:16px"><button class="btn">${selected===c.id?'✓ Selecionado':'Escolher este curso'}</button></div></div>`).join('')||'<div class="muted">Nenhum curso/cargo disponível para venda.</div>';$('continue').disabled=!selected;const c=courses.find(x=>x.id===selected);$('summary').style.display=c?'block':'none';if(c)$('summary').innerHTML=`Você está comprando: <strong>${esc(c.name)}</strong> — ${money(c.price_cents||1990)}. Após o pagamento confirmado, somente este curso/cargo será liberado por 1 ano.`}function selectCourse(id){selected=id;render()}async function init(){const{data}=await sb.auth.getSession();if(!data.session){sessionStorage.setItem('ap_target',location.href);location.href='login.html';return}const{data:c,error}=await sb.from('courses').select('id,name,slug,description,price_cents').eq('active',true).order('id');if(error){$('msg').className='msg err';$('msg').textContent=error.message;return}courses=c||[];const requested=String(new URLSearchParams(location.search).get('course')||'').trim().toLowerCase();const found=courses.find(c=>String(c.id)===requested||String(c.slug||'').toLowerCase()===requested);if(found)selected=found.id;render()}$('continue').onclick=async()=>{if(!selected)return;const{data}=await sb.auth.getSession();if(!data.session)return;const c=courses.find(x=>x.id===selected);if(!c)return;$('continue').disabled=true;$('continue').textContent='Criando pagamento...';$('msg').className='msg';$('msg').textContent='Preparando o checkout seguro...';const{data:p,error}=await sb.from('purchases').insert({user_id:data.session.user.id,course_id:c.id,amount_cents:c.price_cents||1990,currency:'BRL',status:'pending',provider:'mercadopago'}).select('id').single();if(error){$('msg').className='msg err';$('msg').textContent=error.message;$('continue').disabled=false;$('continue').textContent='Continuar para pagamento';return}sessionStorage.setItem('pending_purchase_id',p.id);sessionStorage.setItem('pending_course_id',String(c.id));const r=await sb.functions.invoke('create-payment',{body:{purchase_id:p.id}});if(r.error||!r.data?.init_point){$('msg').className='msg err';$('msg').textContent=r.error?.message||r.data?.message||'Não foi possível iniciar o pagamento. A função de pagamento ainda precisa estar publicada no Supabase.';$('continue').disabled=false;$('continue').textContent='Tentar novamente';return}location.href=r.data.init_point};init();</script></body></html>
