<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AprovaAI — Comprar acesso</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#0d1014;color:#fff;font:14px Arial}.wrap{max-width:900px;margin:auto;padding:24px}.hero,.card{background:#181d23;border:1px solid #303740;border-radius:16px}.hero{padding:24px;background:linear-gradient(135deg,#171b21,#3d3515)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.card{padding:18px}.card.selected{border-color:#e4c64a;box-shadow:0 0 0 1px #e4c64a}.muted{color:#a6adb7}.btn{border:0;border-radius:9px;padding:11px 15px;background:#e4c64a;color:#111;font-weight:800;cursor:pointer}.secondary{background:#2b3139;color:#fff;border:1px solid #434a54}.price{font-size:24px;font-weight:900;margin:14px 0}.msg{margin-top:16px;padding:12px;border-radius:9px}.ok{background:#1c3027;color:#8be3b7}.err{background:#2b1b1e;color:#ffb4b4}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><h1>Escolha seu curso</h1><p class="muted">Você compra somente o curso escolhido. O acesso será liberado automaticamente após a confirmação do pagamento.</p></section><div id="grid" class="grid"></div><div style="margin-top:18px"><button id="continue" class="btn" disabled>Continuar para pagamento</button> <a class="btn secondary" href="concursos.html">Voltar</a></div><div id="msg"></div></main><script>const sb=supabase.createClient('https://ztqtcbzjesrkuaijmylm.supabase.co','sb_publishable_Lh0A_Ykm2h66ur3LojJKTQ_JdUVMK9d');let courses=[],selected=null;const $=id=>document.getElementById(id);const money=v=>(Number(v||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function init(){const{data}=await sb.auth.getSession();if(!data.session){sessionStorage.setItem('ap_target','checkout.html');location.href='login.html';return}const{data:c,error}=await sb.from('courses').select('id,name,slug,description,price_cents').eq('active',true).order('id');if(error){$('msg').className='msg err';$('msg').textContent=error.message;return}courses=c||[];render()}function render(){$('grid').innerHTML=courses.map(c=>`<div class="card ${selected===c.id?'selected':''}" onclick="selectCourse(${c.id})"><h2>${esc(c.name)}</h2><p class="muted">${esc(c.description||'')}</p><div class="price">${c.price_cents?money(c.price_cents):'Preço a definir'}</div><button class="btn">${selected===c.id?'✓ Selecionado':'Escolher'}</button></div>`).join('')||'<div class="muted">Nenhum curso disponível.</div>';$('continue').disabled=!selected}function selectCourse(id){selected=id;render()}$('continue').onclick=async()=>{if(!selected)return;const{data}=await sb.auth.getSession();if(!data.session)return;const c=courses.find(x=>x.id===selected);const{data:p,error}=await sb.from('purchases').insert({user_id:data.session.user.id,course_id:c.id,amount_cents:c.price_cents||0,currency:'BRL',status:'pending'}).select('id').single();if(error){$('msg').className='msg err';$('msg').textContent=error.message;return}sessionStorage.setItem('pending_purchase_id',p.id);sessionStorage.setItem('pending_course_id',String(c.id));$('msg').className='msg ok';$('msg').textContent='Pedido criado. Agora conectaremos esta compra ao gateway de pagamento. ID: '+p.id};init();</script></body></html>
