<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProvaNorte — Concursos</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="brand.js"></script><style>:root{--bg:#0d1014;--panel:#181d23;--line:#303740;--gold:#e4c64a;--muted:#a6adb7;--ok:#8be3b7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f5f5;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{color:#fff;text-decoration:none;font-size:27px;font-weight:900}.brand b{color:var(--gold)}.account{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.user{font-size:13px;color:var(--muted)}.btn{display:inline-block;border:0;border-radius:10px;padding:11px 15px;background:var(--gold);color:#111;font-weight:800;text-decoration:none;cursor:pointer}.dark{background:#2b3139;color:#fff;border:1px solid #434a54}.admin{background:#302a12;color:#f2d86b;border:1px solid #6b5a1c}.hero{padding:35px;border:1px solid #343b45;border-radius:22px;background:linear-gradient(135deg,#171b21,#3d3515);margin-top:20px}.tag{display:inline-block;padding:6px 10px;border-radius:99px;background:#2a2511;color:#f2d86b;border:1px solid #51451b;font-size:12px;font-weight:bold}h1{font-size:42px;margin:12px 0 10px}.muted{color:var(--muted);line-height:1.5}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}.card{display:flex;flex-direction:column;min-height:250px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:25px}.icon{font-size:40px;margin:10px 0}.card h2{margin:5px 0 10px}.actions{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}.mini{font-size:12px;color:var(--muted);margin-top:10px}.freebox{margin-top:18px;padding:20px;border:1px solid #51451b;border-radius:16px;background:#191710;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.freebox strong{color:#f2d86b}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.wrap{padding:18px}.grid{grid-template-columns:1fr}h1{font-size:32px}.top{align-items:flex-start;flex-wrap:wrap}}</style></head><body><div class="wrap"><header class="top"><a class="brand" href="concursos.html">Prova<b>Norte</b></a><div id="account" class="account"></div></header><section class="hero"><span class="tag">PLATAFORMA DE ESTUDOS</span><h1>Escolha sua preparação</h1><p class="muted">Treine gratuitamente ou escolha um curso. Cada preparação possui acesso independente.</p><div class="freebox"><div><strong>🎯 Teste grátis</strong><br><span class="muted">Faça 3 questões aleatórias do curso que você escolher. Sem cadastro.</span></div><a class="btn" href="simulados-gratis.html">Fazer simulado grátis</a></div></section><div class="grid" id="courses"></div></div><script>const sb=supabase.createClient('https://ztqtcbzjesrkuaijmylm.supabase.co','sb_publishable_Lh0A_Ykm2h66ur3LojJKTQ_JdUVMK9d');const courses=[{icon:'🦟',name:'ACE Maricá',description:'Agente de Combate às Endemias — Maricá/RJ.',target:'ace_marica.html',courseId:1},{icon:'⚓',name:'Transpetro',description:'Seleção de cargos e trilhas da Transpetro.',target:'transpetro_cargos.html',courseId:2},{icon:'⚡',name:'Inspetor de Elétrica',description:'Preparação para Inspetor de Elétrica Nível 1.',target:'inspetor_eletrica.html',courseId:3}];let session=null,access=new Set(),isAdmin=false;const coursesEl=document.getElementById('courses'),account=document.getElementById('account');async function init(){const{data}=await sb.auth.getSession();session=data.session;if(session){const{data:a}=await sb.rpc('is_admin');isAdmin=a===true;const{data:e}=await sb.from('user_courses').select('course_id,status,expires_at').eq('user_id',session.user.id).eq('status','active').gt('expires_at',new Date().toISOString());access=new Set((e||[]).map(x=>String(x.course_id)));account.innerHTML=`<span class="user">${session.user.email||''}</span>${isAdmin?'<a class="btn admin" href="admin-v2.html">⚙️ Painel ADM</a>':''}<button class="btn dark" onclick="logout()">Sair</button>`}else account.innerHTML='<a class="btn dark" href="login.html">🔐 Entrar</a><a class="btn" href="login.html?cadastro=1">Criar conta</a>';render()}function render(){coursesEl.innerHTML=courses.map(c=>{const has=isAdmin||access.has(String(c.courseId));return `<div class="card"><div class="icon">${c.icon}</div><h2>${c.name}</h2><p class="muted">${c.description}</p><div class="actions">${has?`<a class="btn" href="${c.target}">▶ Estudar</a>`:`<a class="btn" href="checkout.html?course=${c.courseId}">💳 Comprar — R$ 19,90</a>`}</div><div class="mini">${!session?'🔒 Entre para comprar ou estudar':has?(isAdmin?'🟢 Acesso administrativo':'🟢 Acesso liberado'):'🔒 Curso não liberado para esta conta'}</div></div>`}).join('')}async function logout(){await sb.auth.signOut();location.reload()}init();</script></body></html>
