<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AprovaAI — Transpetro | Cargos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0d1014;--panel:#181d23;--line:#303740;--gold:#e4c64a;--muted:#a6adb7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{color:#fff;text-decoration:none;font-size:25px;font-weight:900}.brand b{color:var(--gold)}
.btn{background:var(--gold);color:#111;border:0;border-radius:10px;padding:11px 15px;font-weight:800;text-decoration:none;cursor:pointer;display:inline-block}.back{color:#ddd;text-decoration:none}.back:hover{color:var(--gold)}
.hero{background:linear-gradient(135deg,#171b21,#3d3515);border:1px solid #3b3b31;border-radius:20px;padding:28px;margin-top:18px}.tag{color:#f2d86b;font-weight:700;font-size:13px}.hero h1{margin:10px 0}.muted{color:var(--muted);line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;min-height:210px;display:flex;flex-direction:column;transition:.2s}.card:hover{border-color:var(--gold);transform:translateY(-2px)}.number{color:var(--gold);font-size:13px;font-weight:800}.card h2{margin:10px 0 8px}.card .btn{margin-top:auto;text-align:center}
@media(max-width:700px){.wrap{padding:16px}.grid{grid-template-columns:1fr}.top{flex-wrap:wrap}}
</style>
</head>
<body>

<div class="grid" id="grid"></div>
</div>

 {numero:'6',nome:'Análise de Sistemas — SAP',polo:'RJ',descricao:'Ênfase 6 • Análise de Sistemas / SAP • Ambiente completo de questões e acompanhamento.'}
];

 sb.auth.getSession().then(({data})=>{
