<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AprovaAI — Transpetro | Cargos</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#0d1014;--panel:#181d23;--line:#303740;--gold:#e4c64a;--muted:#a6adb7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{color:#fff;text-decoration:none;font-size:25px;font-weight:900}.brand b{color:var(--gold)}.btn{background:var(--gold);color:#111;border:0;border-radius:10px;padding:11px 15px;font-weight:800;text-decoration:none;cursor:pointer;display:inline-block}.back{color:#ddd;text-decoration:none}.hero{background:linear-gradient(135deg,#171b21,#3d3515);border:1px solid #3b3b31;border-radius:20px;padding:28px;margin-top:18px}.tag{color:#f2d86b;font-weight:700;font-size:13px}.hero h1{margin:10px 0}.muted{color:var(--muted);line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;min-height:210px;display:flex;flex-direction:column;transition:.2s}.card:hover{border-color:var(--gold);transform:translateY(-2px)}.number{color:var(--gold);font-size:13px;font-weight:800}.card h2{margin:10px 0 8px}.card .btn{margin-top:auto;text-align:center}.authbox{margin-top:18px;padding:14px;background:#151a20;border:1px solid var(--line);border-radius:14px;display:flex;justify-content:flex-end;gap:8px;align-items:center}.authbox input{padding:10px;background:#0e1115;color:#fff;border:1px solid #343b45;border-radius:9px;width:150px}@media(max-width:700px){.wrap{padding:16px}.grid{grid-template-columns:1fr}.top{flex-wrap:wrap}.authbox{display:grid;grid-template-columns:1fr 1fr}.authbox input{width:100%}.authbox .btn{width:100%;text-align:center}}
</style></head><body><div class="wrap"><header class="top"><a class="brand" href="index.html">Aprova<b>AI</b></a><a class="btn" href="index.html">← Concursos</a></header><div class="authbox"><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Senha"><button class="btn" onclick="login()">Entrar</button><a class="btn" href="login.html?cadastro=1">Cadastro</a></div><div id="msg" class="muted" style="text-align:right;margin-top:6px"></div><section class="hero"><span class="tag">TRANSPETRO • NÍVEL SUPERIOR • 2026.4</span><h1>Cargos desejados</h1><p class="muted">Aqui aparecem os cargos/ênfases que você escolheu acompanhar. Para a Transpetro, o ambiente atualmente preparado é Análise de Sistemas — SAP.</p></section><div class="grid" id="grid"></div></div><script>const sb=supabase.createClient('https://ztqtcbzjesrkuaijmylm.supabase.co','sb_publishable_Lh0A_Ykm2h66ur3LojJKTQ_JdUVMK9d');const cargosDesejados=[{numero:'6',nome:'Análise de Sistemas — SAP',polo:'RJ',descricao:'Ênfase 6 • Análise de Sistemas / SAP • Ambiente completo de questões e acompanhamento.'}];function estudar(){sb.auth.getSession().then(({data})=>{if(data.session){location.href='transpetro.html';return}sessionStorage.setItem('ap_target','transpetro.html');location.href='login.html'})}grid.innerHTML=cargosDesejados.map(c=>`<div class="card"><div class="number">ÊNFASE ${c.numero}</div><h2>${c.nome}</h2><p class="muted"><b>Polo:</b> ${c.polo}<br>${c.descricao}</p><button class="btn" onclick="estudar()">ESTUDAR →</button></div>`).join('');async function login(){msg.textContent='Entrando...';const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){msg.textContent='E-mail ou senha inválidos.';return}const target=sessionStorage.getItem('ap_target')||'transpetro.html';sessionStorage.removeItem('ap_target');location.href=target}</script></body></html>
